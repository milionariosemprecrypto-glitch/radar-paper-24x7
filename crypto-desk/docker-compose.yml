# PC dedicado do Julio: painel + TimescaleDB (Postgres) + Redis. Tudo grátis/open-source.
# Hoje o app usa SQLite + memória (funciona sem Docker). Postgres/Redis ficam prontos para a próxima etapa
# (troca do Store por TimescaleStore/RedisStore usando o schema em deploy/schema.sql).
services:
  desk:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]     # só no seu PC; para celular na rede local troque para "8000:8000"
    volumes: ["./data:/app/data"]
    restart: unless-stopped
    depends_on: [db, redis]
  db:
    image: timescale/timescaledb:latest-pg16
    environment: {POSTGRES_USER: desk, POSTGRES_PASSWORD: desk, POSTGRES_DB: desk}
    volumes: ["pgdata:/var/lib/postgresql/data", "./deploy/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped
volumes: {pgdata: {}}
